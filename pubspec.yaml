name: hisobnoma
description: "Hisobnoma - Financial tracking and accounting mobile app"
publish_to: 'none'
version: 1.0.3+4

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  fl_chart: ^0.70.2
  google_fonts: ^6.2.1
  flutter_screenutil: ^5.9.3
  pull_to_refresh_flutter3: ^2.0.2

  # State Management
  flutter_bloc: ^9.1.0
  bloc: ^9.0.0
  equatable: ^2.0.7

  # Dependency Injection
  get_it: ^8.0.3

  # Networking
  dio: ^5.8.0
  json_annotation: ^4.9.0

  # Navigation
  go_router: ^15.1.2

  # Storage
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  sqflite: ^2.4.2
  path: ^1.9.1

  # Utils
  intl: ^0.20.2
  uuid: ^4.5.1

  # App Icon & Splash
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.5
  image: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  json_serializable: ^6.9.4
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#1E3A8A"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#000000"
  image: "assets/icon/app_icon.png"
  image_dark: "assets/icon/app_icon.png"
  android_12:
    color: "#FFFFFF"
    color_dark: "#000000"
    icon_background_color: "#1E3A8A"
    image: "assets/icon/app_icon.png"

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/images/
    - assets/svg/
