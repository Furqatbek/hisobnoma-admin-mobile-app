org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Compile Kotlin inside the Gradle daemon instead of spawning a separate Kotlin
# daemon. The separate daemon was crashing ("Daemon compilation failed: null")
# when the machine (or a 7GB CI runner) couldn't give it memory on top of the
# Gradle heap. In-process is more robust; bound the Gradle heap above accordingly.
kotlin.compiler.execution.strategy=in-process
